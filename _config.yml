# GitHub Pages configuration.
# The book prints the site address machyman.github.io/hyman2026learning, so Pages
# must be enabled for that link to resolve: Settings > Pages > Source: "Deploy from a
# branch" > Branch: main > Folder: / (root). Save. The site builds from README.md.
#
# Theme: Just the Docs, pinned to a release, for a sidebar and site search (v2.1.0).
# To roll back to the previous look, restore the earlier copy of this one file: no page
# depends on the theme. If a build fails, GitHub Pages keeps serving the last good site.
title: Learning with AI
description: Companion materials for the book by James M. Hyman (SIAM Books)
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "Repository on GitHub":
    - "https://github.com/machyman/hyman2026learning"
footer_content: >-
  Companion materials for <em>Learning with AI</em> by James M. Hyman (SIAM Books).
  Repository materials are MIT-licensed; the book is under SIAM copyright.

# CONTRIBUTING.md must be listed here or it will not render as a page.
# GitHub Pages runs jekyll-optional-front-matter, which deliberately skips a short
# list of meta files (README, CONTRIBUTING, CODE_OF_CONDUCT, LICENSE). A skipped file
# stays a static file, so machyman.github.io/hyman2026learning/CONTRIBUTING.md serves
# raw Markdown, and jekyll-relative-links leaves links to it unrewritten. Listing it
# here makes it a page; the FEEDBACK.md and ERRATA.md links inside it then rewrite
# to .html automatically. The alternative is YAML front matter at the top of
# CONTRIBUTING.md, which github.com renders as a visible table on the repo page.
include:
  - CONTRIBUTING.md
# Directory READMEs are NOT listed here. That was tried on 2026-08-20 and did not produce working
# pages: jekyll-optional-front-matter skips files named README and `include` does not override it.
# Each directory README now carries YAML front matter with a permalink instead. A file with front
# matter is a page unconditionally, no plugin involved, and the permalink puts it at the directory
# URL, which is the form the book prints.
exclude:
  - LICENSE
  - CITATION.cff

# Sidebar. Every page is searchable; only the pages below appear in the sidebar.
# The structure lives here, not in the pages, so no page changes and github.com shows
# no extra front matter. A page's own front-matter title wins over a title set here.
# Jekyll gives the most specific path precedence, so the first rule hides everything
# and the later rules show the chosen pages.
