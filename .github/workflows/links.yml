# Monthly link check. On the first of each month, lychee checks every link in the
# repository's Markdown files. If any link fails, the workflow opens an issue that lists
# them. Run it by hand from the Actions tab ("Link check", then "Run workflow").
# Sites that refuse automated visitors (403) or ask them to slow down (429) are counted
# as working, so the issue lists only links that are really broken.
name: Link check

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --no-progress
            --max-concurrency 4
            --max-retries 2
            --timeout 30
            --accept '100..=103,200..=299,403,429'
            './**/*.md'
          fail: false

      - name: Open an issue listing the broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: "Link check: broken links found"
          content-filepath: ./lychee/out.md
